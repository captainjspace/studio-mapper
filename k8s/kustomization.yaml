apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio-map
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
# files/ is staged by `make k8s-deploy`; a sheet change gets a new hash and rolls the pod
configMapGenerator:
  - name: studio-map-config
    files:
      - files/studio_config.json
      - files/studio-inputs.csv
      - files/presets.txt
